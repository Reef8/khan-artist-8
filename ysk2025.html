  <main>

        </div>

          <!-- Video example -->
        <div class="portfolio-item">
          <figure>

        <div class="portfolio-item"><img class="lightbox-trigger" src="images/yk8.jpeg" alt="Artwork 8"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/yk9.jpeg" alt="Artwork 9"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/yk10.jpeg" alt="Artwork 10"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/yk11.jpeg" alt="Artwork 11"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/yk12.jpeg" alt="Artwork 12"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/yk13.jpeg" alt="Artwork 13"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/yk14.jpeg" alt="Artwork 14"></div>

      </div>
    </section>
  </main>

  <!-- Lightbox modal with navigation -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close">&times;</span>
    <span class="lightbox-prev">&#10094;</span>
    <div class="lightbox-content-container">
      <img class="lightbox-content" id="lightbox-img" src="" alt="Enlarged artwork" style="display:none;">
      <video class="lightbox-content" id="lightbox-video" controls style="display:none;"></video>
    </div>
    <span class="lightbox-next">&#10095;</span>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxVideo = document.getElementById('lightbox-video');
    const closeBtn = document.querySelector('.lightbox-close');
    const prevBtn = document.querySelector('.lightbox-prev');
    const nextBtn = document.querySelector('.lightbox-next');
    const triggers = document.querySelectorAll('.lightbox-trigger');

    let currentIndex = 0;

const showLightbox = (index) => {
  const item = triggers[index];
  lightbox.style.display = 'flex';
  if(item.tagName.toLowerCase() === 'video') {
    lightboxImg.style.display = 'none';
    lightboxVideo.style.display = 'block';
    lightboxVideo.src = item.src;
    lightboxVideo.muted = true; // ensure muted
    lightboxVideo.play();       // autoplay
  } else {
    lightboxVideo.style.display = 'none';
    lightboxImg.style.display = 'block';
    lightboxImg.src = item.src;
    lightboxVideo.pause();
    lightboxVideo.src = '';
  }
  currentIndex = index;
}

    triggers.forEach((item, index) => {
      item.addEventListener('click', () => showLightbox(index));
    });

    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
      lightboxVideo.pause();
      lightboxVideo.src = '';
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + triggers.length) % triggers.length;
      showLightbox(currentIndex);
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % triggers.length;
      showLightbox(currentIndex);
    });

    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) {
        lightbox.style.display = 'none';
        lightboxVideo.pause();
        lightboxVideo.src = '';
      }
    });

    document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'ArrowLeft') prevBtn.click();
        if (e.key === 'ArrowRight') nextBtn.click();
        if (e.key === 'Escape') closeBtn.click();
      }
    });
  </script>
</body>
</html>
