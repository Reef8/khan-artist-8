  </main>

  <!-- Lightbox -->
  <div class="lightbox">
    <span class="close">&times;</span>
    <div class="lightbox-content"></div>
    <a class="prev">&#10094;</a>
    <a class="next">&#10095;</a>
  </div>

  <script>
    const items = document.querySelectorAll('.portfolio-item img, .portfolio-item video');
    const lightbox = document.querySelector('.lightbox');
    const lightboxContent = document.querySelector('.lightbox-content');
    const closeBtn = document.querySelector('.lightbox .close');
    const prevBtn = document.querySelector('.lightbox .prev');
    const nextBtn = document.querySelector('.lightbox .next');
    let currentIndex = 0;

    function openLightbox(index) {
      lightbox.style.display = 'flex';
      const element = items[index].cloneNode(true);

      // Apply consistent sizing (images & videos)
      element.style.maxWidth = "90vw";
      element.style.maxHeight = "80vh";
      element.style.width = "auto";
      element.style.height = "auto";
      element.style.display = "block";
      element.style.margin = "auto";
      element.style.borderRadius = "8px";

      if (element.tagName === 'VIDEO') {
        element.controls = true;
        element.autoplay = true;
        element.muted = false;
        element.loop = false;
      }

      lightboxContent.innerHTML = '';
      lightboxContent.appendChild(element);
      currentIndex = index;
    }

    items.forEach((item, i) => {
      item.addEventListener('click', () => openLightbox(i));
    });

    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
      lightboxContent.innerHTML = '';
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + items.length) % items.length;
      openLightbox(currentIndex);
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % items.length;
      openLightbox(currentIndex);
    });
  </script>
</body>
</html>
