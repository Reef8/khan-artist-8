<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khan Artist - PSA 2024</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="logo-container">
    <h1>Khan Artist</h1>
    <img src="images/logo.png" alt="Khan Artist Logo" class="logo">
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="about.html">About</a>
    <a href="locations.html">Locations</a>
    <a href="contact.html">Contact</a>
    <a href="psa2024.html" class="active">PSA 2024</a>
  </nav>
</header>

<!-- PSA 2024 Section -->
<section class="making-art">
  <h2>PSA 2024 Series</h2>
  <div class="art-row">
    <div class="art-item">
      <img src="images/ysk25-1.jpeg" alt="PSA Artwork 1">
      <p class="caption">PSA 2024 — Artwork 1</p>
    </div>
    <div class="art-item">
      <img src="images/ysk25-2.jpeg" alt="PSA Artwork 2">
      <p class="caption">PSA 2024 — Artwork 2</p>
    </div>
    <div class="art-item">
      <img src="images/ysk25-3.jpeg" alt="PSA Artwork 3">
      <p class="caption">PSA 2024 — Artwork 3</p>
    </div>
    <div class="art-item">
      <img src="images/ysk25-4.jpeg" alt="PSA Artwork 4">
      <p class="caption">PSA 2024 — Artwork 4</p>
    </div>
  </div>
</section>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close">&times;</span>
  <span class="lightbox-prev">&#10094;</span>
  <div class="lightbox-content"></div>
  <span class="lightbox-next">&#10095;</span>
</div>

<script>
  const lightbox = document.getElementById("lightbox");
  const lightboxContent = document.querySelector(".lightbox-content");
  const closeBtn = document.querySelector(".lightbox-close");
  const prevBtn = document.querySelector(".lightbox-prev");
  const nextBtn = document.querySelector(".lightbox-next");

  const items = Array.from(document.querySelectorAll(".art-item img"));
  let currentIndex = 0;

  function showLightbox(index) {
    currentIndex = index;
    const item = items[index];
    lightboxContent.innerHTML = `<img src="${item.src}" alt="" style="max-width:90vw; max-height:80vh; width:auto; height:auto; display:block; margin:auto; border-radius:8px;">`;
    lightbox.style.display = "flex";
  }

  items.forEach((item, index) => {
    item.addEventListener("click", () => showLightbox(index));
  });

  closeBtn.addEventListener("click", () => {
    lightbox.style.display = "none";
    lightboxContent.innerHTML = "";
  });

  prevBtn.addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + items.length) % items.length;
    showLightbox(currentIndex);
  });

  nextBtn.addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % items.length;
    showLightbox(currentIndex);
  });

  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
      lightbox.style.display = "none";
      lightboxContent.innerHTML = "";
    }
  });

  document.addEventListener("keydown", (e) => {
    if (lightbox.style.display === "flex") {
      if (e.key === "ArrowLeft") prevBtn.click();
      if (e.key === "ArrowRight") nextBtn.click();
      if (e.key === "Escape") closeBtn.click();
    }
  });
</script>
</body>
</html>
