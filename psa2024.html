  <!-- Modal for zoom effect -->
  <div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImage">
    <a class="prev" onclick="changeImage(-1)">&#10094;</a>
    <a class="next" onclick="changeImage(1)">&#10095;</a>
  </div>

  <script>
    const images = [
      "images/ysk25-1.jpeg","images/ysk25-2.jpeg","images/ysk25-3.jpeg","images/ysk25-4.jpeg","images/ysk25-5.jpeg",
      "images/ysk25-6.jpeg","images/ysk25-7.jpeg","images/ysk25-8.jpeg","images/ysk25-9.jpeg","images/ysk25-10.jpeg",
      "images/ysk25-11.jpeg","images/ysk25-12.jpeg","images/ysk25-13.jpeg","images/ysk25-14.jpeg","images/ysk25-15.jpeg",
      "images/ysk25-16.jpeg","images/ysk25-17.jpeg","images/ysk25-18.jpeg","images/ysk25-19.jpeg","images/ysk25-20.jpeg",
      "images/ysk25-21.jpeg","images/ysk25-22.jpeg","images/ysk25-23.jpeg","images/ysk25-24.jpeg","images/ysk25-25.jpeg"
    ];
    let currentIndex = 0;

    function openModal(index) {
      currentIndex = index;
      document.getElementById("imageModal").style.display = "block";
      document.getElementById("modalImage").src = images[index];
    }

    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
    }

    function changeImage(n) {
      currentIndex = (currentIndex + n + images.length) % images.length;
      document.getElementById("modalImage").src = images[currentIndex];
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closeModal();
      if (event.key === "ArrowRight") changeImage(1);
      if (event.key === "ArrowLeft") changeImage(-1);
    });
  </script>
