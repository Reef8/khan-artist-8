<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <header>
    <h1>Khan Artist</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a href="locations.html" class="active">Locations</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="collection">
      <h2>Yusuf Khan Invitational 2023</h2>
      <p>Seattle, WA – 2023</p>

      <div class="art-grid">
        <div class="art-item"><img src="images/ysk23-1.jpeg" alt="Artwork 1"></div>
        <div class="art-item"><img src="images/ysk23-2.jpeg" alt="Artwork 2"></div>
        <div class="art-item"><img src="images/ysk23-3.jpeg" alt="Artwork 3"></div>
        <div class="art-item"><img src="images/ysk23-4.jpeg" alt="Artwork 4"></div>
        <div class="art-item"><img src="images/ysk23-5.jpeg" alt="Artwork 1"></div>
        <div class="art-item"><img src="images/ysk23-6.jpeg" alt="Artwork 2"></div>
        <div class="art-item"><img src="images/ysk23-7.jpeg" alt="Artwork 3"></div>
        <div class="art-item"><img src="images/ysk23-8.jpeg" alt="Artwork 4"></div>
        <div class="art-item"><img src="images/ysk23-9.jpeg" alt="Artwork 1"></div>
        <div class="art-item"><img src="images/ysk23-10.jpeg" alt="Artwork 2"></div>
        <div class="art-item"><img src="images/ysk23-11.jpeg" alt="Artwork 3"></div>
        <div class="art-item"><img src="images/ysk23-12.jpeg" alt="Artwork 4"></div>
        <div class="art-item"><img src="images/ysk23-13.jpeg" alt="Artwork 1"></div>
        <div class="art-item"><img src="images/ysk23-14.jpeg" alt="Artwork 2"></div>
        <div class="art-item"><img src="images/ysk23-15.jpeg" alt="Artwork 3"></div>
        <div class="art-item"><img src="images/ysk23-16.jpeg" alt="Artwork 4"></div>
        <!-- Add more images here if needed -->
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <span class="close">&times;</span>
    <span class="prev">&#10094;</span>
    <img class="lightbox-content" id="lightbox-img">
    <span class="next">&#10095;</span>
  </div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeBtn = document.querySelector(".close");
    const prevBtn = document.querySelector(".prev");
    const nextBtn = document.querySelector(".next");

    const images = Array.from(document.querySelectorAll(".art-item img"));
    let currentIndex = 0;

    images.forEach((img, index) => {
      img.addEventListener("click", () => {
        currentIndex = index;
        lightbox.style.display = "flex";
        lightboxImg.src = img.src;
      });
    });

    closeBtn.addEventListener("click", () => {
      lightbox.style.display = "none";
    });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) lightbox.style.display = "none";
    });

    prevBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      lightboxImg.src = images[currentIndex].src;
    });

    nextBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      currentIndex = (currentIndex + 1) % images.length;
      lightboxImg.src = images[currentIndex].src;
    });
  </script>
</body>
</html>
