<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khan Artist - Jewelbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Khan Artist</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a href="locations.html" class="active">Locations</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="collection">
      <h2>Jewelbox</h2>
      <p>Seattle, WA – 2023</p>

      <div class="portfolio-grid">
        <div class="portfolio-item"><img src="images/jewel1.jpeg" alt="Jewelbox artwork 1" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel2.jpeg" alt="Jewelbox artwork 2" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel3.jpeg" alt="Jewelbox artwork 3" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel4.jpeg" alt="Jewelbox artwork 4" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel5.jpeg" alt="Jewelbox artwork 5" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel6.jpeg" alt="Jewelbox artwork 6" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel7.jpeg" alt="Jewelbox artwork 7" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel8.jpeg" alt="Jewelbox artwork 8" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel9.jpeg" alt="Jewelbox artwork 9" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel10.jpeg" alt="Jewelbox artwork 10" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel11.jpeg" alt="Jewelbox artwork 11" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel12.jpeg" alt="Jewelbox artwork 12" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel13.jpeg" alt="Jewelbox artwork 13" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel14.jpeg" alt="Jewelbox artwork 14" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel15.jpeg" alt="Jewelbox artwork 15" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel16.jpeg" alt="Jewelbox artwork 16" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel17.jpeg" alt="Jewelbox artwork 17" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel18.jpeg" alt="Jewelbox artwork 18" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel19.jpeg" alt="Jewelbox artwork 19" class="lightbox-trigger"></div>
        <div class="portfolio-item"><img src="images/jewel20.jpeg" alt="Jewelbox artwork 20" class="lightbox-trigger"></div>
      </div>
    </section>
  </main>

  <!-- Lightbox modal -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img" src="" alt="Enlarged artwork">
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.lightbox-close');
    const triggers = document.querySelectorAll('.lightbox-trigger');

    triggers.forEach(img => {
      img.addEventListener('click', () => {
        lightbox.style.display = 'flex';
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
      });
    });

    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    // Close lightbox by clicking outside the image
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) {
        lightbox.style.display = 'none';
      }
    });
  </script>
</body>
</html>
