  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Khan Artist</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="about.html">About</a>
      <a href="locations.html" class="active">Locations</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="collection">
      <h2>Jewelbox</h2>
      <p>Seattle, WA – 2023</p>

      <div class="portfolio-grid">
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel1.jpeg" alt="Jewelbox artwork 1"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel2.jpeg" alt="Jewelbox artwork 2"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel3.jpeg" alt="Jewelbox artwork 3"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel4.jpeg" alt="Jewelbox artwork 4"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel5.jpeg" alt="Jewelbox artwork 5"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel6.jpeg" alt="Jewelbox artwork 6"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel7.jpeg" alt="Jewelbox artwork 7"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel8.jpeg" alt="Jewelbox artwork 8"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel9.jpeg" alt="Jewelbox artwork 9"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel10.jpeg" alt="Jewelbox artwork 10"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel11.jpeg" alt="Jewelbox artwork 11"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel12.jpeg" alt="Jewelbox artwork 12"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel13.jpeg" alt="Jewelbox artwork 13"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel14.jpeg" alt="Jewelbox artwork 14"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel15.jpeg" alt="Jewelbox artwork 15"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel16.jpeg" alt="Jewelbox artwork 16"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel17.jpeg" alt="Jewelbox artwork 17"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel18.jpeg" alt="Jewelbox artwork 18"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel19.jpeg" alt="Jewelbox artwork 19"></div>
        <div class="portfolio-item"><img class="lightbox-trigger" src="images/jewel20.jpeg" alt="Jewelbox artwork 20"></div>
      </div>
    </section>
  </main>

  <!-- Lightbox modal with navigation -->
  <div class="lightbox" id="lightbox">
    <span class="lightbox-close">&times;</span>
    <span class="lightbox-prev">&#10094;</span>
    <img class="lightbox-content" id="lightbox-img" src="" alt="Enlarged artwork">
    <span class="lightbox-next">&#10095;</span>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.lightbox-close');
    const prevBtn = document.querySelector('.lightbox-prev');
    const nextBtn = document.querySelector('.lightbox-next');
    const triggers = document.querySelectorAll('.lightbox-trigger');

    let currentIndex = 0;

    const showLightbox = (index) => {
      const img = triggers[index];
      lightbox.style.display = 'flex';
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      currentIndex = index;
    }

    triggers.forEach((img, index) => {
      img.addEventListener('click', () => showLightbox(index));
    });

    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + triggers.length) % triggers.length;
      showLightbox(currentIndex);
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % triggers.length;
      showLightbox(currentIndex);
    });

    // Close lightbox by clicking outside the image
    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) {
        lightbox.style.display = 'none';
      }
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (lightbox.style.display === 'flex') {
        if (e.key === 'ArrowLeft') prevBtn.click();
        if (e.key === 'ArrowRight') nextBtn.click();
        if (e.key === 'Escape') closeBtn.click();
      }
    });
  </script>
</body>
</html>
